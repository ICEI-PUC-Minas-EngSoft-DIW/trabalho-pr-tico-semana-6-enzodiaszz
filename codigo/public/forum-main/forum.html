<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forum.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Fórum Global</title>
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top py-1">
        <div class="container-fluid">


            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../Bitcoin-Logo-700x394.png" width="70" height="40" class="me-2">
                <span>BitLearn</span>
            </a>


            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.coingecko.com/pt-br/moedas/bitcoin"
                            target="_blank">Preço</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://bipa.app" target="_blank">Compre Agora</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../minha-conta/minha-conta.html">Minha Conta</a>
                    </li>
                </ul>
            </div>

        </div>
    </header>
    <main class="container mt-7">
            <div id="postar" class="d-flex justify-content-end mb-3">
            <button class="btn btn-success rounded-pill text-white" type="button" data-bs-toggle="modal" data-bs-target="#meuModal">Faça sua postagem</button>
                <div class="modal fade" id="meuModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Postar</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form action="" class="d-flex flex-column gap-3">
                                    <label for=""></label>
                                    <input type="text" placeholder="Digite o título da sua postagem..." id="titulo">

                                    <label for=""></label>
                                    <textarea 
                                        class="form-control" 
                                        id="conteudo"
                                        placeholder="Conteúdo da sua postagem..."
                                        oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"
                                    ></textarea>
                                </form>
                            </div>
                            
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnEnviar">Enviar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="lista-postagens"></div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="forum.js" type="module"></script>
</body>

</html>
